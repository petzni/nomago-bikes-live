name: Statistika in objava strani

# Vsakih 15 minut izračuna statistiko iz Supabase in objavi stran na GitHub Pages.
# Potrebuje skrivnost DATABASE_URL (Supabase Session pooler); brez nje se nič ne objavi.
on:
  schedule:  # rezerva; glavni sprožilec je Supabase (nb.trigger_build) vsakih 15 min
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Ljubljana
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "mode=live" >> "$GITHUB_OUTPUT"
          else echo "mode=skip" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode != 'skip'

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'skip'
        with:
          python-version: "3.12"

      # Lokalna kopija baze v predpomnilniku: iz Supabase se prenesejo samo nove vrstice (prihranek pri egress).
      # Po migraciji, ki popravlja stare vožnje, povečaj številko v ključu, da se kopija zgradi znova.
      - name: Lokalna kopija baze (predpomnilnik)
        if: steps.mode.outputs.mode == 'live'
        uses: actions/cache@v4
        with:
          path: mirror
          key: mirror-v1-${{ github.run_id }}
          restore-keys: mirror-v1-

      - name: Statistika (lokalna kopija, sinhronizirana s Supabase)
        if: steps.mode.outputs.mode == 'live'
        env:
          NB_DB: mirror/nb.sqlite
          NB_INTERNAL_DIR: mirror/internal
        run: |
          pip install "psycopg[binary]"
          mkdir -p mirror
          python tools/mirror.py pull 2> err.txt || { cat err.txt; echo "::error::$(tail -n 3 err.txt | tr '\n' ' ')"; exit 1; }
          DATABASE_URL= python builder.py 2> err.txt || { cat err.txt; echo "::error::$(tail -n 3 err.txt | tr '\n' ' ')"; exit 1; }
          python tools/mirror.py push 2> err.txt || { cat err.txt; echo "::warning::$(tail -n 3 err.txt | tr '\n' ' ')"; }

      - name: Nastavitve strani
        if: steps.mode.outputs.mode != 'skip'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          printf 'window.NB_CONFIG = { supabaseUrl: "%s", supabaseAnonKey: "%s" };\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > site/config.js

      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.mode != 'skip'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
